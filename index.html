<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    overflow-x: hidden;
    background: #0f1417; color: #e8f1f2;
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { width: 100%; max-width: 480px; margin: 0 auto; padding: 12px; }

  #top { position: relative; height: 56px; margin-bottom: 10px; }
  .stat {
    position: absolute; top: 0; height: 56px; width: 40%;
    background: #172026; border-radius: 12px; padding: 8px 14px; overflow: hidden;
  }
  #statScore { left: 0; }
  #statBest { right: 0; text-align: right; }
  .stat small { display: block; color: #8a9ba3; font-size: 12px; line-height: 16px; }
  .stat b { display: block; font-size: 22px; line-height: 26px; }
  #pauseBtn {
    position: absolute; top: 4px; left: 50%; margin-left: -24px;
    width: 48px; height: 48px; padding: 0; border: 0; border-radius: 12px;
    background: #172026; color: #e8f1f2; cursor: pointer;
  }

  #wrap { position: relative; width: 100%; height: 320px; margin: 0 auto; }
  #board {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    display: block; border-radius: 16px; background: #172026;
  }
  #overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    border-radius: 16px; background: rgba(0, 0, 0, .6); color: #fff; text-align: center;
  }
  #overlay.hidden { display: none; }
  #ovInner {
    position: absolute; left: 0; right: 0; top: 50%; padding: 0 16px;
    -webkit-transform: translateY(-50%); transform: translateY(-50%);
  }
  #ovTitle { margin: 0 0 8px; font-size: 28px; }
  #ovText { margin: 0 0 6px; opacity: .85; font-size: 15px; }
  #ovRecord { margin: 0 0 6px; color: #ffd166; font-weight: bold; font-size: 15px; min-height: 18px; }
  #ovBtn {
    border: 0; border-radius: 12px; padding: 12px 32px;
    background: #19c3b1; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer;
  }

  #pad { position: relative; width: 208px; height: 112px; margin: 14px auto 0; }
  #pad button {
    position: absolute; width: 64px; height: 52px; padding: 0; border: 0; border-radius: 14px;
    background: #172026; color: #e8f1f2; cursor: pointer;
  }
  #pad button.on { background: #19c3b1; color: #fff; }
  #pad .up { left: 72px; top: 0; }
  #pad .left { left: 0; top: 60px; }
  #pad .down { left: 72px; top: 60px; }
  #pad .right { left: 144px; top: 60px; }
  svg.ic { width: 22px; height: 22px; fill: currentColor; display: block; margin: 0 auto; }
  .hint { color: #8a9ba3; font-size: 13px; margin-top: 10px; text-align: center; }
  #err { color: #ff8a8a; font-size: 12px; margin-top: 8px; text-align: center; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat" id="statScore"><small>Счёт</small><b id="score">0</b></div>
    <button id="pauseBtn" aria-label="Пауза"></button>
    <div class="stat" id="statBest"><small>Рекорд</small><b id="best">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="board"></canvas>
    <div id="overlay">
      <div id="ovInner">
        <h1 id="ovTitle">Змейка</h1>
        <p id="ovText">Свайпайте по полю или жмите стрелки</p>
        <p id="ovRecord"></p>
        <button id="ovBtn">Играть</button>
      </div>
    </div>
  </div>

  <div id="pad">
    <button class="up" data-dir="up" aria-label="Вверх"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6l8 11H4z"/></svg></button>
    <button class="left" data-dir="left" aria-label="Влево"><svg class="ic" viewBox="0 0 24 24"><path d="M6 12l11-8v16z"/></svg></button>
    <button class="down" data-dir="down" aria-label="Вниз"><svg class="ic" viewBox="0 0 24 24"><path d="M12 18L4 7h16z"/></svg></button>
    <button class="right" data-dir="right" aria-label="Вправо"><svg class="ic" viewBox="0 0 24 24"><path d="M18 12L7 20V4z"/></svg></button>
  </div>
  <div class="hint">Ешьте яблоки и не врезайтесь в стены и в себя</div>
  <div id="err"></div>
</div>

<script>
window.onerror = function (msg, src, line) {
  var el = document.getElementById("err");
  if (el) el.textContent = "Ошибка: " + msg + " (" + line + ")";
};
</script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var N = 20;
  var BEST_KEY = "vprime-snake-best";
  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  function $(id) { return document.getElementById(id); }
  var canvas = $("board");
  var ctx = canvas.getContext("2d");
  var scoreEl = $("score"), bestEl = $("best");
  var overlay = $("overlay"), ovTitle = $("ovTitle"), ovText = $("ovText"),
      ovRecord = $("ovRecord"), ovBtn = $("ovBtn"), pauseBtn = $("pauseBtn");
  var app = $("app"), top = $("top"), wrap = $("wrap"), pad = $("pad");

  var colors = { card: "#172026", text: "#e8f1f2", accent: "#19c3b1", food: "#ff5a5f" };
  var cell = 0;
  var snake, dir, queue, food, score, stepMs, acc, lastT = 0, eatPulse = 0;
  var state = "ready"; // ready | running | paused | over
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

  function haptic(kind, value) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === "impact") tg.HapticFeedback.impactOccurred(value);
      else if (kind === "notify") tg.HapticFeedback.notificationOccurred(value);
      else tg.HapticFeedback.selectionChanged();
    } catch (e) {}
  }

  function applyTheme() {
    var p = (tg && tg.themeParams) || {};
    if (p.bg_color) { document.body.style.background = p.bg_color; document.documentElement.style.background = p.bg_color; }
    if (p.text_color) { document.body.style.color = p.text_color; colors.text = p.text_color; }
    if (p.button_color) { colors.accent = p.button_color; ovBtn.style.background = p.button_color; }
    if (p.button_text_color) ovBtn.style.color = p.button_text_color;
  }

  function show(el, on) {
    el.className = on ? "" : "hidden";
  }

  // Viewport units are unreliable in some WebViews (they can be 0 at startup),
  // so every size here is measured and set in pixels.
  function layout() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 0;
    if (!vw || vw < 100) vw = (screen && screen.width) || 360;
    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
    if (tg && tg.viewportStableHeight > 100) vh = vh > 100 ? Math.min(vh, tg.viewportStableHeight) : tg.viewportStableHeight;
    var size = Math.min(vw - 24, 480);
    if (vh > 300) size = Math.min(size, vh - 24 - 66 - 126 - 40);
    size = Math.max(200, Math.floor(size));
    app.style.width = (size + 24) + "px";
    wrap.style.width = size + "px";
    wrap.style.height = size + "px";
    resize();
  }

  var ICON_PAUSE = '<svg class="ic" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  var ICON_PLAY = '<svg class="ic" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
  function setPauseIcon(paused) {
    pauseBtn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var css = wrap.offsetWidth || parseInt(wrap.style.width, 10) || 300;
    var size = Math.round(css * dpr);
    if (size > 0 && canvas.width !== size) {
      canvas.width = size;
      canvas.height = size;
    }
    cell = canvas.width / N;
  }

  function onSnake(x, y, list) {
    for (var i = 0; i < list.length; i++) if (list[i].x === x && list[i].y === y) return true;
    return false;
  }

  function reset() {
    var mid = Math.floor(N / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    stepMs = 140;
    acc = 0;
    food = placeFood();
    scoreEl.textContent = "0";
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < N; y++)
      for (var x = 0; x < N; x++)
        if (!onSnake(x, y, snake)) free.push({ x: x, y: y });
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function setDir(name) {
    var d = DIRS[name];
    if (!d) return;
    if (state === "ready" || state === "over") start();
    if (state === "paused") resume();
    var lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d === lastDir || (d.x === -lastDir.x && d.y === -lastDir.y)) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return gameOver();

    var eating = food && head.x === food.x && head.y === food.y;
    // Without eating the tail moves away this step, so its cell is free.
    var body = eating ? snake : snake.slice(0, -1);
    if (onSnake(head.x, head.y, body)) return gameOver();

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      stepMs = Math.max(65, 140 - score * 2.5);
      eatPulse = 1;
      haptic("impact", "light");
      food = placeFood();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
  }

  function showOverlay(title, text, btn, record) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovRecord.textContent = record || "";
    ovBtn.textContent = btn;
    show(overlay, true);
  }

  function start() {
    reset();
    state = "running";
    show(overlay, false);
    setPauseIcon(false);
  }

  function pause() {
    if (state !== "running") return;
    state = "paused";
    setPauseIcon(true);
    showOverlay("Пауза", "Счёт: " + score, "Продолжить");
  }

  function resume() {
    if (state !== "paused") return;
    state = "running";
    acc = 0;
    setPauseIcon(false);
    show(overlay, false);
  }

  function gameOver(won) {
    state = "over";
    var record = "";
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      if (score > 0) record = "Новый рекорд!";
    }
    haptic("notify", won ? "success" : "error");
    showOverlay(won ? "Победа!" : "Игра окончена", "Счёт: " + score, "Играть ещё", record);
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    resize();
    var W = canvas.width;
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, W, W);

    ctx.fillStyle = colors.text;
    ctx.globalAlpha = 0.04;
    for (var y = 0; y < N; y++)
      for (var x = (y % 2); x < N; x += 2)
        ctx.fillRect(x * cell, y * cell, cell, cell);
    ctx.globalAlpha = 1;

    if (food) {
      var pulse = 1 + 0.08 * Math.sin(t / 180);
      var cx = (food.x + 0.5) * cell, cy = (food.y + 0.5) * cell;
      ctx.fillStyle = colors.food;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.36 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#4caf50";
      ctx.beginPath();
      ctx.arc(cx + cell * 0.1, cy - cell * 0.34, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }

    var len = snake.length;
    var gap = cell * 0.08;
    for (var i = len - 1; i >= 0; i--) {
      var s = snake[i];
      var grow = i === 0 ? eatPulse * cell * 0.08 : 0;
      ctx.globalAlpha = 1 - (i / Math.max(len, 1)) * 0.5;
      ctx.fillStyle = colors.accent;
      roundRect(s.x * cell + gap - grow, s.y * cell + gap - grow,
                cell - gap * 2 + grow * 2, cell - gap * 2 + grow * 2, cell * 0.28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var h = snake[0];
    var hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
    var px = -dir.y, py = dir.x;
    ctx.fillStyle = colors.card;
    for (var side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.arc(hx + dir.x * cell * 0.15 + px * side * cell * 0.18,
              hy + dir.y * cell * 0.15 + py * side * cell * 0.18,
              cell * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    eatPulse = Math.max(0, eatPulse - 0.08);
  }

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function loop() {
    var t = now();
    if (state === "running") {
      acc += Math.min(t - lastT, 250);
      while (acc >= stepMs && state === "running") {
        acc -= stepMs;
        step();
      }
    }
    lastT = t;
    draw(t);
    raf(loop);
  }

  // ---------- Input ----------
  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right"
  };
  document.addEventListener("keydown", function (e) {
    if (KEYS[e.code]) { e.preventDefault(); setDir(KEYS[e.code]); }
    else if (e.code === "Space" || e.code === "KeyP") {
      e.preventDefault();
      if (state === "running") pause();
      else if (state === "paused") resume();
      else start();
    }
  });

  var touch = null;
  wrap.addEventListener("touchstart", function (e) {
    var p = e.touches[0];
    touch = { x: p.clientX, y: p.clientY };
  }, false);
  wrap.addEventListener("touchmove", function (e) {
    if (!touch) return;
    if (e.cancelable) e.preventDefault();
    var p = e.touches[0];
    var dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (state === "running" || state === "paused") {
      setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    }
    touch = { x: p.clientX, y: p.clientY };
  }, false);
  wrap.addEventListener("touchend", function () { touch = null; }, false);

  var btns = pad.getElementsByTagName("button");
  for (var b = 0; b < btns.length; b++) {
    (function (btn) {
      var name = btn.getAttribute("data-dir");
      function press(e) {
        if (e.cancelable) e.preventDefault();
        btn.className = btn.className.replace(" on", "") + " on";
        haptic("select");
        setDir(name);
      }
      function release() { btn.className = btn.className.replace(" on", ""); }
      btn.addEventListener("touchstart", press, false);
      btn.addEventListener("mousedown", press, false);
      btn.addEventListener("touchend", release, false);
      btn.addEventListener("mouseup", release, false);
      btn.addEventListener("mouseleave", release, false);
    })(btns[b]);
  }

  ovBtn.addEventListener("click", function () {
    if (state === "paused") resume(); else start();
  });
  pauseBtn.addEventListener("click", function () {
    if (state === "running") pause(); else if (state === "paused") resume();
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 200); });

  // ---------- Init ----------
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.onEvent("themeChanged", applyTheme); } catch (e) {}
    try { tg.onEvent("viewportChanged", layout); } catch (e) {}
  }
  applyTheme();
  setPauseIcon(false);
  bestEl.textContent = best;
  reset();
  layout();
  // The WebView may finish sizing after load.
  setTimeout(layout, 100);
  setTimeout(layout, 400);
  setTimeout(layout, 1000);
  lastT = now();
  loop();
})();
</script>
</body>
</html>
